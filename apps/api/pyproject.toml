[project]
name = "signora"
version = "0.1.0"
description = "Signora: multi-tenant agreement automation with AI field detection and e-signatures"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"  # PyMuPDF is AGPL; see README for production licensing
authors = [{ name = "Hemanth Puppala" }]
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
signora = "signora.entrypoints.cli:main"

[dependency-groups]
# All developer tooling in one group, so `uv sync` never uninstalls part of it.
# python-docx and reportlab generate the private detection-eval corpus (eval/ is git-ignored).
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# Supply-chain guard: only resolve releases that have been public for at least two weeks.
# Bump deliberately when upgrading dependencies.
exclude-newer = "2026-10-23T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "PTH", "N", "RUF",
    "DTZ",  # timezone-aware datetimes only
    "T20",  # no print()
    "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # assert, subprocess in tests
# Domain errors are named after the condition (NotFound, Conflict), matching the LLD catalogue.
"src/signora/kernel/errors.py" = ["N818"]
"src/signora/modules/*/errors.py" = ["N818"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true
# PyMuPDF and python-docx ship partial annotations; calling their unannotated functions is allowed.
untyped_calls_exclude = ["pymupdf", "docx"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["signora"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# Module boundaries (backbone LLD §9.2). Each new module adds its own "public interface only"
# contract and joins the leaf/forbidden lists below as it arrives.
[tool.importlinter]
root_packages = ["signora"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers: entrypoints and composition roots -> modules -> kernel (no upward imports)"
type = "layers"
layers = [
    "signora.entrypoints : signora.handlers : signora.models : signora.migrations",
    "signora.modules",
    "signora.kernel",
]
containers = []

[[tool.importlinter.contracts]]
name = "Public interface only: audit internals are imported only by audit and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.audit.domain",
    "signora.modules.audit.service",
    "signora.modules.audit.models",
]
allowed_importers = ["signora.modules.audit", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: notifications internals are imported only by notifications and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.notifications.layout",
    "signora.modules.notifications.models",
    "signora.modules.notifications.service",
    "signora.modules.notifications.transports",
]
allowed_importers = ["signora.modules.notifications", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: identity_access internals are imported only by identity_access and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.identity_access.access",
    "signora.modules.identity_access.accounts",
    "signora.modules.identity_access.dependencies",
    "signora.modules.identity_access.domain",
    "signora.modules.identity_access.errors",
    "signora.modules.identity_access.hooks",
    "signora.modules.identity_access.jobs",
    "signora.modules.identity_access.emails",
    "signora.modules.identity_access.invites",
    "signora.modules.identity_access.links",
    "signora.modules.identity_access.login",
    "signora.modules.identity_access.members",
    "signora.modules.identity_access.models",
    "signora.modules.identity_access.passwords",
    "signora.modules.identity_access.routes",
    "signora.modules.identity_access.sessions",
    "signora.modules.identity_access.signup",
]
allowed_importers = ["signora.modules.identity_access", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: departments internals are imported only by departments and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.departments.access",
    "signora.modules.departments.countersigners",
    "signora.modules.departments.domain",
    "signora.modules.departments.errors",
    "signora.modules.departments.models",
    "signora.modules.departments.routes",
    "signora.modules.departments.service",
]
allowed_importers = ["signora.modules.departments", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: documents internals are imported only by documents and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.documents.conversion",
    "signora.modules.documents.current",
    "signora.modules.documents.domain",
    "signora.modules.documents.errors",
    "signora.modules.documents.jobs",
    "signora.modules.documents.lifecycle",
    "signora.modules.documents.models",
    "signora.modules.documents.pdf",
    "signora.modules.documents.processing",
    "signora.modules.documents.routes",
    "signora.modules.documents.service",
    "signora.modules.documents.uploads",
]
allowed_importers = ["signora.modules.documents", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: detection internals are imported only by detection and composition roots"
type = "protected"
protected_modules = [
    "signora.modules.detection.ai",
    "signora.modules.detection.blanks",
    "signora.modules.detection.derive",
    "signora.modules.detection.form_fields",
    "signora.modules.detection.geometry",
    "signora.modules.detection.jobs",
    "signora.modules.detection.layout",
    "signora.modules.detection.models",
    "signora.modules.detection.page_text",
    "signora.modules.detection.prompt",
    "signora.modules.detection.read",
    "signora.modules.detection.reading",
    "signora.modules.detection.routes",
    "signora.modules.detection.run",
    "signora.modules.detection.schema",
    "signora.modules.detection.untrusted",
]
allowed_importers = ["signora.modules.detection", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Public interface only: review internals are imported only by review and composition roots"
type = "protected"
# review.keys and review.values are pure and public: detection's pure code imports them
# directly, without the package's database half.
protected_modules = [
    "signora.modules.review.checks",
    "signora.modules.review.editing",
    "signora.modules.review.errors",
    "signora.modules.review.fieldset",
    "signora.modules.review.models",
    "signora.modules.review.proposal",
    "signora.modules.review.routes",
    "signora.modules.review.service",
    "signora.modules.review.store",
    "signora.modules.review.views",
]
allowed_importers = ["signora.modules.review", "signora.models", "signora.handlers"]

[[tool.importlinter.contracts]]
name = "Documents never depend on detection (detection drives documents through documents.lifecycle)"
type = "forbidden"
source_modules = ["signora.modules.documents"]
forbidden_modules = ["signora.modules.detection"]

[[tool.importlinter.contracts]]
name = "One direction: detection -> review -> documents (ADR-R1); review never depends on detection"
type = "forbidden"
source_modules = ["signora.modules.review"]
forbidden_modules = ["signora.modules.detection"]

[[tool.importlinter.contracts]]
name = "Documents never depend on review (review drives documents through documents.lifecycle)"
type = "forbidden"
source_modules = ["signora.modules.documents"]
forbidden_modules = ["signora.modules.review"]

[[tool.importlinter.contracts]]
name = "Leaf modules import only the kernel"
type = "forbidden"
source_modules = ["signora.modules.audit", "signora.modules.notifications"]
forbidden_modules = [
    "signora.entrypoints",
    "signora.handlers",
    "signora.models",
    "signora.migrations",
]

[[tool.importlinter.contracts]]
name = "Pure domain: domain modules import no web framework or database library"
type = "forbidden"
source_modules = [
    "signora.modules.audit.domain",
    "signora.modules.departments.domain",
    "signora.modules.documents.domain",
    "signora.modules.identity_access.domain",
    # Detection's reading and deriving: from a PDF's bytes and the AI's answer to fields.
    "signora.modules.detection.blanks",
    "signora.modules.detection.derive",
    "signora.modules.detection.form_fields",
    "signora.modules.detection.geometry",
    "signora.modules.detection.layout",
    "signora.modules.detection.page_text",
    "signora.modules.detection.prompt",
    "signora.modules.detection.read",
    "signora.modules.detection.reading",
    "signora.modules.detection.schema",
    "signora.modules.detection.untrusted",
    # Review's naming of keys and its one list of values, shared with detection.
    "signora.modules.review.keys",
    "signora.modules.review.values",
]
forbidden_modules = ["fastapi", "starlette", "sqlalchemy", "psycopg", "alembic"]
