[project]
name = "signora"
version = "0.1.0"
description = "Signora: multi-tenant agreement automation with AI field detection and e-signatures"
requires-python = ">=3.12,<3.13"
license = "AGPL-3.0-only"  # PyMuPDF is AGPL; see README for production licensing
authors = [{ name = "Hemanth Puppala" }]
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.161.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pymupdf>=2.0",
    "pymupdf4llm>=2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.6",
    "stripe>=16.0.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
signora = "signora.entrypoints.cli:main"

[dependency-groups]
# All developer tooling in one group, so `uv sync` never uninstalls part of it.
# python-docx and reportlab generate the private detection-eval corpus (eval/ is git-ignored).
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-docx>=1.2.0",
    "reportlab>=5.1.0",
    "ruff>=0.17.2",
]

[build-system]
requires = ["uv_build>=0.9.17,<0.10"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]
# Supply-chain guard: only resolve releases that have been public for at least two weeks.
# Bump deliberately when upgrading dependencies.
exclude-newer = "2026-10-23T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "C4", "SIM", "RET", "PTH", "N", "RUF",
    "DTZ",  # timezone-aware datetimes only
    "T20",  # no print()
    "ASYNC",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # assert, subprocess in tests

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["signora"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
