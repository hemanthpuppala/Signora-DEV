# Signora local stack. Run via the Makefile (make up), which passes the root .env.
name: signora

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    ports:
      # Host access for local tooling only; containers use postgres:5432 on the internal network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  gotenberg:
    # LibreOffice-only image: DOCX/ODT -> PDF. Pinned; 9.x was released 2026-11-05 and is not adopted yet.
    image: gotenberg/gotenberg:8.40.0-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --libreoffice-restart-after=50
      - --log-format=json
    ports:
      # Host access for local development and tests only.
      - "127.0.0.1:${GOTENBERG_HOST_PORT:-53000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

volumes:
  pgdata:

networks:
  internal:
