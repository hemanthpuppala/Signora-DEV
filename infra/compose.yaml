# Signora local stack. Run via the Makefile (make up), which passes the root .env.
name: signora

services:
  postgres:
    image: postgres:18.4-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/<major>/docker
      - pgdata:/var/lib/postgresql
    ports:
      # Host access for local processes only; containers use postgres:5432 on the app network.
      - "127.0.0.1:${POSTGRES_PORT:?set in .env}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  gotenberg:
    # LibreOffice-only image: DOCX/ODT -> PDF. Pinned; 9.x was released 2026-11-05 and is not adopted yet.
    # Converts untrusted uploads, so it gets no network egress (convert network is internal-only)
    # and every outbound feature is switched off as a second layer against SSRF.
    image: gotenberg/gotenberg:8.40.0-libreoffice
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --api-disable-download-from
      - --webhook-disable
      - --libreoffice-deny-private-ips
      - --libreoffice-deny-public-ips
      - --libreoffice-restart-after=50
      - --log-std-format=json
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [convert]

  gotenberg-gateway:
    # Docker cannot publish ports from an internal-only network, so this TCP forwarder is the only
    # way in: it publishes 127.0.0.1:53000 for host processes and forwards to gotenberg:3000.
    # Inbound only; it gives Gotenberg no route out.
    image: alpine/socat:1.8.1.1
    restart: unless-stopped
    command: ["tcp-listen:3000,fork,reuseaddr", "tcp-connect:gotenberg:3000"]
    depends_on:
      gotenberg:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GOTENBERG_PORT:?set in .env}:3000"
    networks: [app, convert]

  mailpit:
    # Development mail capture (EMAIL_PROVIDER=mailpit): accepts any message over SMTP and shows it
    # in a web inbox. Both ports are published on loopback only.
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "1000"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"  # SMTP
      - "127.0.0.1:8025:8025"  # web inbox and API
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  # --- Application (profile "app": `make up-app`). Served publicly through Caddy + Funnel. -----

  migrate:
    profiles: [app]
    image: signora-api:local
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      args:
        SIGNORA_COMMIT: ${SIGNORA_COMMIT:-dev}
    command: ["signora", "migrate"]
    env_file: ../.env
    environment: &in-network
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      GOTENBERG_HOST: gotenberg
      GOTENBERG_PORT: "3000"
      MAILPIT_HOST: mailpit
      MAILPIT_SMTP_PORT: "1025"
      BLOB_STORE_DIR: /app/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks: [app]

  api:
    profiles: [app]
    image: signora-api:local
    pull_policy: never  # built by the migrate service (same image)
    command: ["signora", "api", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ../.env
    environment:
      <<: *in-network
      # Reachable only through Caddy on the internal network, so proxy headers are trustworthy.
      API_TRUST_PROXY_HEADERS: "true"
    volumes:
      - blobs:/app/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    restart: unless-stopped
    networks: [app, convert]

  worker:
    profiles: [app]
    image: signora-api:local
    pull_policy: never  # built by the migrate service (same image)
    command: ["signora", "worker"]
    env_file: ../.env
    environment: *in-network
    volumes:
      - blobs:/app/data/blobs
    depends_on:
      migrate:
        condition: service_completed_successfully
      gotenberg:
        condition: service_healthy
    # The watchdog exits the process when the loop stalls; this restarts it (LLD §7.4).
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/signora-worker.heartbeat) )) -lt 30"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3
    networks: [app, convert]

  web:
    profiles: [app]
    image: signora-web:local
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks: [app]

  caddy:
    profiles: [app]
    image: caddy:2.11.7-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      # Tailscale Funnel forwards https://<host>.ts.net to this port.
      - "127.0.0.1:3100:3100"
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks: [app]

volumes:
  pgdata:
  blobs:

networks:
  # Application network: postgres, migrate, api, worker, web, caddy.
  app:
  # Conversion network: no external connectivity. Services that call Gotenberg directly
  # (api and worker) join it and use http://gotenberg:3000.
  convert:
    internal: true
